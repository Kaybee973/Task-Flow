<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Taskr</title>
  <link rel="icon" href="/static/images/logo.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
<div class="auth-wrapper">

  <div class="auth-panel-left">
    <div class="auth-logo"><span>Task</span>r</div>
    <h1 class="auth-headline">Get started<br>in seconds.</h1>
    <p class="auth-sub">
      Create your free account. No credit card needed.
      Start organising your tasks immediately.
    </p>
    <img src="/static/images/auth-illustration.svg" alt="" style="margin-top:2.5rem; max-width:260px; opacity:.85;"/>

    <div style="margin-top:auto; padding-top:2rem;">
      <p class="text-xs text-muted" style="margin-bottom:.5rem;">GO ROUTES ON THIS PAGE</p>
      <div class="flex flex-col gap-1">
        <span class="route-pill"><span class="method">POST</span>/register</span>
        <span class="route-pill"><span class="method">GET</span>/register</span>
      </div>
    </div>
  </div>

  <div class="auth-panel-right">
    <div class="auth-form-box">
      <h2 style="font-size:1.6rem; font-weight:800; margin-bottom:.35rem;">Create your account</h2>
      <p class="text-muted mb-2">Fill in the details below to get started.</p>

      <div id="alert-zone"></div>

      <!--
        Go handler: POST /register
        Fields: name, email, password, password_confirm
        Validate: unique email, password match, bcrypt hash
        Redirect to /login or /dashboard after success
      -->
      <form id="register-form" method="POST" action="/register">
        <div class="form-group">
          <label for="name">Full name</label>
          <input class="form-control" type="text" id="name" name="name"
                 placeholder="Jane Doe" autocomplete="name" required/>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input class="form-control" type="email" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email" required/>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password"
                 placeholder="••••••••" autocomplete="new-password" required/>
          <span class="form-hint">At least 8 characters</span>
        </div>

        <div class="form-group">
          <label for="password_confirm">Confirm password</label>
          <input class="form-control" type="password" id="password_confirm" name="password_confirm"
                 placeholder="••••••••" autocomplete="new-password" required/>
        </div>

        <div style="margin-bottom:1.25rem;">
          <label style="display:flex; align-items:flex-start; gap:.75rem; cursor:pointer; font-size:.85rem; color:var(--muted);">
            <input type="checkbox" name="terms" required style="margin-top:3px; accent-color:var(--accent);"/>
            I agree to the <a href="/terms" style="color:var(--accent);">Terms of Service</a> and
            <a href="/privacy" style="color:var(--accent);">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-full">Create account</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </div>

</div>
<script src="/static/js/app.js"></script>
</body>
</html>
